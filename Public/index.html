<!DOCTYPE html>
<html lang="de">
	<head>
		<meta charset="UTF-8">
		<script src="app.js" defer></script>
		<link rel="stylesheet" href="style.css">
		<title>Deutsch lernen mit Fafa</title>
	</head>
	<body>
		<div id="translator">
			<div id="wrapper1">
				<h1 id="header">Übersetzer</h1>
				<button id="lang">deutsch</button>
			</div>
			<input id="input" type="text" placeholder="Drücke 'Enter' zum Übersetzen">
			<p id="output"></p>
		</div>
		<div id="proverb">
			<button id="random">Roll the Dice</button>
			<p id="prompt">for a Random Proverb. Click it to discover the meaning:</p>
			<h2 id="proverbDisplay"></h2>
			<p id="proverbMeaning"></p>
		</div>
	</body>
</html>
